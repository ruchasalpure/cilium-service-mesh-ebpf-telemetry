spec_version: "0.1.0"
name: "cilium-service-mesh-ebpf-telemetry"
version: "1.0.0"
category: "devtools"
author: "Rucha Salpure"
description: "Injects kernel-space eBPF socket-level programs to accelerate L7 service mesh mTLS traffic and eliminate sidecar proxy context switches"
capabilities:
  - "sockops-kernel-acceleration"
  - "autonomous-decision-making"
  - "explainable-auditing"
  - "multi-agent-collaboration"
skills:
  - "sockops-kernel-acceleration"
tools:
  - "python_executor"
  - "audit_logger"
  - "schema_validator"
runtime:
  environment: "python3.11"
  memory_limit: "4GB"
  timeout_seconds: 300
governance:
  audit_logging: true
  human_in_the_loop: false
  maker_checker: true
  explainability_required: true
