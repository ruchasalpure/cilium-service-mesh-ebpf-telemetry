spec_version: "0.1.0"
name: cilium-service-mesh-ebpf-telemetry
version: 1.0.0
description: Injects kernel-space eBPF socket-level programs to accelerate L7 service mesh mTLS traffic and eliminate sidecar proxy context switches.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - sockops-kernel-acceleration
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/cilium-service-mesh-ebpf-telemetry"
